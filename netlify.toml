# `generate:importmap` runs before every build, and that is deliberate.
# payload.config.ts registers the R2 storage plugin only when the R2 variables
# are present, and that plugin contributes an admin client component. A committed
# importMap therefore describes whichever environment last generated it: one
# generated locally, without R2, omits `S3ClientUploadHandler`, and the admin
# view throws at runtime in production, where R2 *is* configured. Regenerating
# per build makes the map match the environment it is built for, instead of the
# machine it was last generated on.
[build]
  command = "pnpm generate:importmap && pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24.14.0"
  PNPM_VERSION = "11.16.0"
  # Turbopack writes a build cache under .next/cache (surfaced by Netlify as
  # .netlify/.next/cache). That directory is never deployed, but the secrets
  # scanner reads it and finds PAYLOAD_SECRET there, because payload.config.ts
  # evaluates the server environment at build time. Only the cache is exempt:
  # scanning stays enabled for the deployed output, where it matters.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"
  # Netlify treats every environment variable as a secret by default. These
  # three are public by design and are *meant* to appear in the deployed output:
  #   R2_BUCKET          a configuration identifier; knowing it grants no access
  #   R2_PUBLIC_URL      the public media origin, emitted in every <img src>
  #   NEXT_PUBLIC_SERVER_URL  the canonical site origin, emitted in canonical
  #                           links, JSON-LD and Open Graph tags
  # Anything that actually grants access — PAYLOAD_SECRET, DATABASE_URL, the R2
  # key pair, R2_ENDPOINT, R2_ACCOUNT_ID — stays scanned. Never add one here.
  SECRETS_SCAN_OMIT_KEYS = "R2_BUCKET,R2_PUBLIC_URL,NEXT_PUBLIC_SERVER_URL"

[context.production]
  command = "pnpm payload migrate && pnpm generate:importmap && pnpm build"

# Preview origins change on every build, so the value cannot live in the
# Netlify UI. NEXT_PUBLIC_ variables are inlined at compile time, which is why
# it is exported before the build rather than read at runtime.
[context.deploy-preview]
  command = "export NEXT_PUBLIC_SERVER_URL=$DEPLOY_PRIME_URL && pnpm payload migrate && pnpm generate:importmap && pnpm build"

[context.branch-deploy]
  command = "export NEXT_PUBLIC_SERVER_URL=$DEPLOY_PRIME_URL && pnpm payload migrate && pnpm generate:importmap && pnpm build"

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

[[plugins]]
  package = "@netlify/plugin-nextjs"
